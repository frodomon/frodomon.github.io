<section class="dark-hero-wrapper fullwidth" style="--dark-hero-image: url('{{ page.dark_hero_image }}')">
  <div class="dark-hero">
    <h1 class="dark-hero-title">{{ page.headline | default: page.title }}</h1>
    <p class="dark-hero-description">{{ page.subheadline | default: page.excerpt }}</p>
  </div>
</section>
