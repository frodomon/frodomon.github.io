{% assign labels = site.data.translations[lang].labels %}
<header class="fullwidth d-flex flex-flow-row-wrap justify-content-between align-items-center">
  <div class='left fullheight d-flex align-items-center flex-flow-row-wrap justify-content-center'>
    <a href="{{ '/'  | relative_url }}">
      <img id="logo-header" src="{{ '/assets/images/AV-Logo.svg' | relative_url }}" data-light="{{ '/assets/images/AV-Logo.svg' | relative_url }}" data-dark="{{ '/assets/images/AV-Logo-White.svg' | relative_url }}" alt="{{ site.title }}" width="238" height="40">
    </a>
  </div>
  <div class='right fullheight d-flex align-items-center flex-flow-row-wrap justify-content-center'>
    <button class="menu-toggle" aria-label="{{ labels.toggle_menu }}" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    {% include menu.html %}
  </div>
</header>
