<figure>
  <div class="post-video-embed">
    {% if page.video_url contains "youtube" or page.video_url contains "youtu.be" %}
      <iframe src="{{ page.video_url }}" title="{{ page.title }}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    {% else %}
      <video controls preload="metadata" poster="{{ page.featured_image }}">
        <source src="{{ page.video_url }}">
      </video>
    {% endif %}
  </div>
  {% if page.video_caption %}
    <figcaption>{{ page.video_caption }}</figcaption>
  {% endif %}
</figure>
<h1>{{ page.title }}</h1>
{% assign body = content | strip %}
{% if body != "" %}
  {{ content }}
{% else %}
  <p class="post-excerpt">{{ page.excerpt }}</p>
{% endif %}
