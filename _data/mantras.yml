- quote: "If you want different results, don't always do the same thing."
  author: "Albert Einstein"
  reflection: "The principle behind every well-made project: question the process before you execute it."

- quote: "If you focus on your competitors, you will have to wait until they do something. If you focus on your customer, you can be a pioneer."
  author: "Jeff Bezos"
  reflection: "I apply this every time someone in a brief asks what the competition is doing before talking about the user."

- quote: "Take care of your employees, and they will take care of your customers."
  author: "Richard Branson"
  reflection: "Organizational design matters just as much as product design — a well cared-for team designs better."

- quote: "It is not the strongest of the species that survives, nor the most intelligent. It is the one most adaptable to change."
  author: "Charles Darwin"
  reflection: "My entire career is an argument for this idea — every turn was an adaptation, not an improvisation."

- quote: "If you walk alone you'll get there faster; if you walk accompanied, you'll get further."
  author: "Chinese proverb"
  reflection: "That's why I prefer small, autonomous teams with a clear purpose over hierarchies that slow things down."

- quote: "If you risk nothing, then you risk everything."
  author: "Geena Davis"
  reflection: "Starting El Tablero de Otto while I had a stable job was the risk that gave me the career I have today."
