- quote: "Si buscas resultados distintos, no hagas siempre lo mismo."
  author: "Albert Einstein"
  reflection: "El principio de todo proyecto bien hecho: cuestionar el proceso antes de ejecutarlo."

- quote: "Si te concentras en la competencia, tendrás que esperar a que esta haga algo. Si te concentras en los clientes, podrás ser pionero."
  author: "Jeff Bezos"
  reflection: "Lo aplico cada vez que alguien en un brief me pregunta qué está haciendo la competencia antes de hablar del usuario."

- quote: "Si cuidas de tus empleados, ellos cuidarán a tus clientes."
  author: "Richard Branson"
  reflection: "El diseño organizacional importa tanto como el diseño de producto — un equipo bien cuidado diseña mejor."

- quote: "No sobreviven los más fuertes ni los más inteligentes. Sobreviven los más adaptables."
  author: "Charles Darwin"
  reflection: "Mi carrera entera es un argumento a favor de esta idea — cada giro fue una adaptación, no una improvisación."

- quote: "Si caminas solo llegarás más rápido; si caminas acompañado, llegarás más lejos."
  author: "Proverbio chino"
  reflection: "Por eso prefiero equipos pequeños, autónomos y con propósito claro, sobre jerarquías que frenan."

- quote: "Si no arriesgas nada, entonces arriesgas todo."
  author: "Geena Davis"
  reflection: "Montar El Tablero de Otto cuando tenía trabajo estable fue el riesgo que me dio la carrera que tengo hoy."
