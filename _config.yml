author:
  name: "Alfredo Vásquez"
  given_name: "Alfredo"
  family_name: "Vásquez"
  email: "vasquez.alf@gmail.com"
  linkedin: "https://www.linkedin.com/in/alfredohvasqueza/"
  twitter: "@alfredohvasquez"
  photo: "/assets/images/Alfredo-Vasquez.webp"
  job_title: "Strategic Design Lead"
  works_for:
    name: "Banco de Credito BCP"
    url: "https://www.viabcp.com"
  knows_about:
    - "Product Design"
    - "Fintech"
    - "Design Leadership"
    - "Service Design"
    - "Digital Strategy"
    - "UX Strategy"
    - "Design Systems"
    - "Organizational Design"
  address_country: "PE"

# Internationalization
default_lang: en
languages: [en, es]

# Collections
collections:
  cases:
    output: true
    permalink: /cases/:name/
  blog:
    output: true
    permalink: /blog/:name/
  # Añadir insights solo cuando tengas contenido:
  # insights:
  #   output: true

# Defaults — evitan repetir front matter en cada archivo
# IMPORTANTE: el orden importa. Jekyll aplica los scopes en secuencia y el
# último que matchea gana en las keys que se repiten. El scope general
# (sin "type") matchea también los items de "cases", así que debe ir
# primero — si no, pisa el layout: "case" con layout: "default".
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "cases"
    values:
      layout: "case"
      og_type: "article"
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "post"
      og_type: "article"

# Plugins
plugins:
  - jekyll-sitemap

# Build
timezone: "America/Lima"
encoding: "utf-8"
markdown: kramdown
highlighter: rouge

# Exclude from build
exclude:
  - .DS_Store
  - "**/.DS_Store"
  - README.md
  - Gemfile
  - Gemfile.lock

sass:
  sass_dir: css
  style: compressed